<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Results | Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <i class="bi bi-mortarboard-fill"></i>
        <span>AcadPortal</span>
      </div>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section">Admin Panel</div>
      <a href="/admin" class="nav-item"><i class="bi bi-grid-1x2-fill"></i><span>Dashboard</span></a>
      <a href="/admin/students" class="nav-item"><i class="bi bi-people-fill"></i><span>Students</span></a>
      <a href="/admin/courses" class="nav-item"><i class="bi bi-book-fill"></i><span>Courses</span></a>
      <a href="/admin/results" class="nav-item active"><i class="bi bi-clipboard-data-fill"></i><span>Results</span></a>
      <div class="nav-section">Account</div>
      <a href="#" class="nav-item" id="logoutBtn"><i class="bi bi-box-arrow-right"></i><span>Logout</span></a>
    </nav>

    <div class="sidebar-footer">
      <div class="user-info">
        <div class="avatar" id="userAvatar">AD</div>
        <div>
          <div class="user-name" id="sidebarUserName">Administrator</div>
          <div class="user-role">Admin</div>
        </div>
      </div>
    </div>
  </div>

  <div class="main-content">
    <header class="top-navbar">
      <div class="d-flex align-items-center gap-3">
        <button class="btn-toggle-sidebar" id="sidebarToggle"><i class="bi bi-list"></i></button>
        <div class="page-title">Record & View Results</div>
      </div>
    </header>

    <div class="page-content">

      <!-- Record Result Form -->
      <div class="card-modern mb-4">
        <div class="card-header-modern">
          <h5 class="mb-0">Record New Result</h5>
        </div>
        <div class="p-4">
          <form id="recordResultForm" class="row g-3">
            <div class="col-md-4">
              <label class="form-label">Student</label>
              <select class="form-select" id="studentId" required>
                <option value="">Select Student</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label">Course</label>
              <select class="form-select" id="courseId" required>
                <option value="">Select Course</option>
              </select>
            </div>
            <div class="col-md-2">
              <label class="form-label">Score (0-100)</label>
              <input type="number" class="form-control" id="score" min="0" max="100" required>
            </div>
            <div class="col-md-2">
              <label class="form-label">Semester</label>
              <select class="form-select" id="semester">
                <option value="First">First</option>
                <option value="Second">Second</option>
              </select>
            </div>
            <div class="col-12">
              <button type="submit" class="btn btn-primary">
                <i class="bi bi-save me-1"></i> Save Result
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- Results Table -->
      <div class="card-modern">
        <div class="card-header-modern d-flex justify-content-between align-items-center">
          <h5 class="mb-0">All Recorded Results</h5>
          <span class="badge bg-primary" id="resultCount">0 Results</span>
        </div>
        <div class="table-responsive">
          <table class="table table-modern">
            <thead>
              <tr>
                <th>Student</th>
                <th>Matric No.</th>
                <th>Course</th>
                <th>Score</th>
                <th>Grade</th>
                <th>Semester</th>
                <th>Session</th>
              </tr>
            </thead>
            <tbody id="resultsBody">
              <tr>
                <td colspan="7" class="text-center py-4 text-muted">Loading results...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

  <script>
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user') || 'null');

    if (!token || !user || user.role !== 'admin') {
      window.location.href = '/login';
    }

    document.getElementById('sidebarUserName').textContent = user.fullName;
    const names = user.fullName.split(' ');
    document.getElementById('userAvatar').textContent = (names.length >= 2 ? names[0][0] + names[1][0] : names[0].substring(0, 2)).toUpperCase();

    document.getElementById('logoutBtn').addEventListener('click', (e) => {
      e.preventDefault();
      localStorage.clear();
      window.location.href = '/login';
    });

    document.getElementById('sidebarToggle').addEventListener('click', () => {
      document.getElementById('sidebar').classList.toggle('show');
    });

    // Load students and courses for the dropdowns
    async function loadDropdowns() {
      try {
        const [studentsRes, coursesRes] = await Promise.all([
          fetch('/api/admin/students', { headers: { 'Authorization': `Bearer ${token}` } }),
          fetch('/api/admin/courses', { headers: { 'Authorization': `Bearer ${token}` } })
        ]);

        const studentsData = await studentsRes.json();
        const coursesData = await coursesRes.json();

        const studentSelect = document.getElementById('studentId');
        const courseSelect = document.getElementById('courseId');

        if (studentsData.success) {
          studentsData.data.forEach(s => {
            studentSelect.innerHTML += `<option value="${s._id}">${s.fullName} (${s.matricNumber || 'No Matric'})</option>`;
          });
        }

        if (coursesData.success) {
          coursesData.data.forEach(c => {
            courseSelect.innerHTML += `<option value="${c._id}">${c.code} - ${c.title}</option>`;
          });
        }
      } catch (err) {
        console.error(err);
      }
    }

    // Load all results
    async function loadResults() {
      try {
        const res = await fetch('/api/admin/results', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();

        const tbody = document.getElementById('resultsBody');
        document.getElementById('resultCount').textContent = `${data.count || 0} Results`;

        if (data.success && data.data.length > 0) {
          tbody.innerHTML = data.data.map(r => `
            <tr>
              <td>${r.student?.fullName || '—'}</td>
              <td>${r.student?.matricNumber || '—'}</td>
              <td><span class="code-badge">${r.course?.code || '—'}</span> ${r.course?.title || ''}</td>
              <td>${r.score}</td>
              <td><span class="grade-badge grade-${r.grade.toLowerCase()}">${r.grade}</span></td>
              <td>${r.semester}</td>
              <td>${r.session}</td>
            </tr>
          `).join('');
        } else {
          tbody.innerHTML = `<tr><td colspan="7" class="text-center py-4 text-muted">No results recorded yet.</td></tr>`;
        }
      } catch (err) {
        console.error(err);
      }
    }

    // Record Result
    document.getElementById('recordResultForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const payload = {
        studentId: document.getElementById('studentId').value,
        courseId: document.getElementById('courseId').value,
        score: Number(document.getElementById('score').value),
        semester: document.getElementById('semester').value,
        session: '2025/2026'
      };

      try {
        const res = await fetch('/api/admin/results', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (data.success) {
          alert(`Result saved! Grade: ${data.data.grade}`);
          document.getElementById('recordResultForm').reset();
          loadResults();
        } else {
          alert(data.message || 'Failed to save result');
        }
      } catch (err) {
        alert('Something went wrong');
      }
    });

    loadDropdowns();
    loadResults();
  </script>
</body>
</html>
