<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Courses | Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <i class="bi bi-mortarboard-fill"></i>
        <span>AcadPortal</span>
      </div>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section">Admin Panel</div>
      <a href="/admin" class="nav-item"><i class="bi bi-grid-1x2-fill"></i><span>Dashboard</span></a>
      <a href="/admin/students" class="nav-item"><i class="bi bi-people-fill"></i><span>Students</span></a>
      <a href="/admin/courses" class="nav-item active"><i class="bi bi-book-fill"></i><span>Courses</span></a>
      <a href="/admin/results" class="nav-item"><i class="bi bi-clipboard-data-fill"></i><span>Results</span></a>
      <div class="nav-section">Account</div>
      <a href="#" class="nav-item" id="logoutBtn"><i class="bi bi-box-arrow-right"></i><span>Logout</span></a>
    </nav>

    <div class="sidebar-footer">
      <div class="user-info">
        <div class="avatar" id="userAvatar">AD</div>
        <div>
          <div class="user-name" id="sidebarUserName">Administrator</div>
          <div class="user-role">Admin</div>
        </div>
      </div>
    </div>
  </div>

  <div class="main-content">
    <header class="top-navbar">
      <div class="d-flex align-items-center gap-3">
        <button class="btn-toggle-sidebar" id="sidebarToggle"><i class="bi bi-list"></i></button>
        <div class="page-title">Manage Courses</div>
      </div>
    </header>

    <div class="page-content">

      <!-- Add Course Form -->
      <div class="card-modern mb-4">
        <div class="card-header-modern">
          <h5 class="mb-0">Add New Course</h5>
        </div>
        <div class="p-4">
          <form id="addCourseForm" class="row g-3">
            <div class="col-md-3">
              <label class="form-label">Course Code</label>
              <input type="text" class="form-control" id="code" placeholder="e.g. CPE411" required>
            </div>
            <div class="col-md-5">
              <label class="form-label">Course Title</label>
              <input type="text" class="form-control" id="title" required>
            </div>
            <div class="col-md-2">
              <label class="form-label">Credit Units</label>
              <input type="number" class="form-control" id="creditUnits" min="1" max="6" value="3" required>
            </div>
            <div class="col-md-2">
              <label class="form-label">Level</label>
              <select class="form-select" id="level">
                <option value="100">100</option>
                <option value="200">200</option>
                <option value="300">300</option>
                <option value="400" selected>400</option>
                <option value="500">500</option>
              </select>
            </div>
            <div class="col-md-3">
              <label class="form-label">Semester</label>
              <select class="form-select" id="semester">
                <option value="First">First</option>
                <option value="Second">Second</option>
              </select>
            </div>
            <div class="col-md-5">
              <label class="form-label">Lecturer</label>
              <input type="text" class="form-control" id="lecturer" placeholder="Dr. Name">
            </div>
            <div class="col-md-4">
              <label class="form-label">Department</label>
              <input type="text" class="form-control" id="department" value="Computer Engineering">
            </div>
            <div class="col-12">
              <button type="submit" class="btn btn-primary">
                <i class="bi bi-plus-lg me-1"></i> Add Course
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- Courses Table -->
      <div class="card-modern">
        <div class="card-header-modern d-flex justify-content-between align-items-center">
          <h5 class="mb-0">All Courses</h5>
          <span class="badge bg-primary" id="courseCount">0 Courses</span>
        </div>
        <div class="table-responsive">
          <table class="table table-modern">
            <thead>
              <tr>
                <th>Code</th>
                <th>Title</th>
                <th>Units</th>
                <th>Level</th>
                <th>Semester</th>
                <th>Lecturer</th>
                <th>Department</th>
              </tr>
            </thead>
            <tbody id="coursesBody">
              <tr>
                <td colspan="7" class="text-center py-4 text-muted">Loading courses...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

  <script>
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user') || 'null');

    if (!token || !user || user.role !== 'admin') {
      window.location.href = '/login';
    }

    document.getElementById('sidebarUserName').textContent = user.fullName;
    const names = user.fullName.split(' ');
    document.getElementById('userAvatar').textContent = (names.length >= 2 ? names[0][0] + names[1][0] : names[0].substring(0, 2)).toUpperCase();

    document.getElementById('logoutBtn').addEventListener('click', (e) => {
      e.preventDefault();
      localStorage.clear();
      window.location.href = '/login';
    });

    document.getElementById('sidebarToggle').addEventListener('click', () => {
      document.getElementById('sidebar').classList.toggle('show');
    });

    async function loadCourses() {
      try {
        const res = await fetch('/api/admin/courses', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();

        const tbody = document.getElementById('coursesBody');
        document.getElementById('courseCount').textContent = `${data.count || 0} Courses`;

        if (data.success && data.data.length > 0) {
          tbody.innerHTML = data.data.map(course => `
            <tr>
              <td><span class="code-badge">${course.code}</span></td>
              <td>${course.title}</td>
              <td>${course.creditUnits}</td>
              <td>${course.level}</td>
              <td>${course.semester}</td>
              <td>${course.lecturer}</td>
              <td>${course.department}</td>
            </tr>
          `).join('');
        } else {
          tbody.innerHTML = `<tr><td colspan="7" class="text-center py-4 text-muted">No courses found.</td></tr>`;
        }
      } catch (err) {
        console.error(err);
      }
    }

    // Add Course
    document.getElementById('addCourseForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const payload = {
        code: document.getElementById('code').value,
        title: document.getElementById('title').value,
        creditUnits: Number(document.getElementById('creditUnits').value),
        level: Number(document.getElementById('level').value),
        semester: document.getElementById('semester').value,
        lecturer: document.getElementById('lecturer').value,
        department: document.getElementById('department').value
      };

      try {
        const res = await fetch('/api/admin/courses', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (data.success) {
          alert('Course added successfully!');
          document.getElementById('addCourseForm').reset();
          loadCourses();
        } else {
          alert(data.message || 'Failed to add course');
        }
      } catch (err) {
        alert('Something went wrong');
      }
    });

    loadCourses();
  </script>
</body>
</html>
