<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Students | Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <i class="bi bi-mortarboard-fill"></i>
        <span>AcadPortal</span>
      </div>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section">Admin Panel</div>
      <a href="/admin" class="nav-item"><i class="bi bi-grid-1x2-fill"></i><span>Dashboard</span></a>
      <a href="/admin/students" class="nav-item active"><i class="bi bi-people-fill"></i><span>Students</span></a>
      <a href="/admin/courses" class="nav-item"><i class="bi bi-book-fill"></i><span>Courses</span></a>
      <a href="/admin/results" class="nav-item"><i class="bi bi-clipboard-data-fill"></i><span>Results</span></a>
      <div class="nav-section">Account</div>
      <a href="#" class="nav-item" id="logoutBtn"><i class="bi bi-box-arrow-right"></i><span>Logout</span></a>
    </nav>

    <div class="sidebar-footer">
      <div class="user-info">
        <div class="avatar" id="userAvatar">AD</div>
        <div>
          <div class="user-name" id="sidebarUserName">Administrator</div>
          <div class="user-role">Admin</div>
        </div>
      </div>
    </div>
  </div>

  <div class="main-content">
    <header class="top-navbar">
      <div class="d-flex align-items-center gap-3">
        <button class="btn-toggle-sidebar" id="sidebarToggle"><i class="bi bi-list"></i></button>
        <div class="page-title">Manage Students</div>
      </div>
    </header>

    <div class="page-content">
      <div class="card-modern">
        <div class="card-header-modern d-flex justify-content-between align-items-center">
          <h5 class="mb-0">All Students</h5>
          <span class="badge bg-primary" id="studentCount">0 Students</span>
        </div>
        <div class="table-responsive">
          <table class="table table-modern">
            <thead>
              <tr>
                <th>Full Name</th>
                <th>Email</th>
                <th>Matric Number</th>
                <th>Department</th>
                <th>Level</th>
                <th>Status</th>
                <th>Joined</th>
              </tr>
            </thead>
            <tbody id="studentsBody">
              <tr>
                <td colspan="7" class="text-center py-4 text-muted">Loading students...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user') || 'null');

    if (!token || !user || user.role !== 'admin') {
      window.location.href = '/login';
    }

    document.getElementById('sidebarUserName').textContent = user.fullName;
    const names = user.fullName.split(' ');
    document.getElementById('userAvatar').textContent = (names.length >= 2 ? names[0][0] + names[1][0] : names[0].substring(0, 2)).toUpperCase();

    document.getElementById('logoutBtn').addEventListener('click', (e) => {
      e.preventDefault();
      localStorage.clear();
      window.location.href = '/login';
    });

    document.getElementById('sidebarToggle').addEventListener('click', () => {
      document.getElementById('sidebar').classList.toggle('show');
    });

    async function loadStudents() {
      try {
        const res = await fetch('/api/admin/students', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();

        const tbody = document.getElementById('studentsBody');
        document.getElementById('studentCount').textContent = `${data.count || 0} Students`;

        if (data.success && data.data.length > 0) {
          tbody.innerHTML = data.data.map(student => `
            <tr>
              <td class="fw-semibold">${student.fullName}</td>
              <td>${student.email}</td>
              <td>${student.matricNumber || '—'}</td>
              <td>${student.department}</td>
              <td>${student.level}</td>
              <td>
                <span class="badge ${student.isActive ? 'bg-success' : 'bg-secondary'}">
                  ${student.isActive ? 'Active' : 'Inactive'}
                </span>
              </td>
              <td>${new Date(student.createdAt).toLocaleDateString()}</td>
            </tr>
          `).join('');
        } else {
          tbody.innerHTML = `<tr><td colspan="7" class="text-center py-4 text-muted">No students found.</td></tr>`;
        }
      } catch (err) {
        console.error(err);
      }
    }

    loadStudents();
  </script>
</body>
</html>
