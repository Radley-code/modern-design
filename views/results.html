<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Results | Student Academic Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <i class="bi bi-mortarboard-fill"></i>
        <span>AcadPortal</span>
      </div>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section">Main</div>
      <a href="/dashboard" class="nav-item"><i class="bi bi-grid-1x2-fill"></i><span>Dashboard</span></a>
      <a href="/courses" class="nav-item"><i class="bi bi-book-fill"></i><span>Courses</span></a>
      <a href="/results" class="nav-item active"><i class="bi bi-clipboard-data-fill"></i><span>Results</span></a>
      <a href="/timetable" class="nav-item"><i class="bi bi-calendar-week-fill"></i><span>Timetable</span></a>
      <div class="nav-section">Account</div>
      <a href="/profile" class="nav-item"><i class="bi bi-person-fill"></i><span>Profile</span></a>
      <a href="#" class="nav-item" id="logoutBtn"><i class="bi bi-box-arrow-right"></i><span>Logout</span></a>
    </nav>

    <div class="sidebar-footer">
      <div class="user-info">
        <div class="avatar" id="userAvatar">--</div>
        <div>
          <div class="user-name" id="sidebarUserName">Loading...</div>
          <div class="user-role" id="sidebarUserRole">Student</div>
        </div>
      </div>
    </div>
  </div>

  <div class="main-content">
    <header class="top-navbar">
      <div class="d-flex align-items-center gap-3">
        <button class="btn-toggle-sidebar" id="sidebarToggle"><i class="bi bi-list"></i></button>
        <div class="page-title">My Results</div>
      </div>
    </header>

    <div class="page-content">
      <!-- GPA Summary -->
      <div class="row g-4 mb-4">
        <div class="col-md-4">
          <div class="stat-card">
            <div class="stat-icon bg-success-soft"><i class="bi bi-trophy"></i></div>
            <div>
              <div class="stat-card-value" id="gpaDisplay">0.00</div>
              <div class="stat-card-label">Current GPA</div>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="stat-card">
            <div class="stat-icon bg-primary-soft"><i class="bi bi-journal-check"></i></div>
            <div>
              <div class="stat-card-value" id="totalCourses">0</div>
              <div class="stat-card-label">Courses with Results</div>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="stat-card">
            <div class="stat-icon bg-warning-soft"><i class="bi bi-star"></i></div>
            <div>
              <div class="stat-card-value" id="totalUnits">0</div>
              <div class="stat-card-label">Total Credit Units</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Results Table -->
      <div class="card-modern">
        <div class="card-header-modern">
          <h5>Academic Results</h5>
        </div>
        <div class="table-responsive">
          <table class="table table-modern">
            <thead>
              <tr>
                <th>Course Code</th>
                <th>Course Title</th>
                <th>Units</th>
                <th>Score</th>
                <th>Grade</th>
                <th>Session</th>
                <th>Semester</th>
              </tr>
            </thead>
            <tbody id="resultsBody">
              <tr>
                <td colspan="7" class="text-center py-4 text-muted">Loading results...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user') || 'null');

    if (!token || !user) window.location.href = '/login';

    // Sidebar info
    document.getElementById('sidebarUserName').textContent = user.fullName;
    document.getElementById('sidebarUserRole').textContent = `Student • ${user.level} Level`;
    const names = user.fullName.split(' ');
    document.getElementById('userAvatar').textContent = (names.length >= 2 ? names[0][0] + names[1][0] : names[0].substring(0, 2)).toUpperCase();

    document.getElementById('logoutBtn').addEventListener('click', (e) => {
      e.preventDefault();
      localStorage.clear();
      window.location.href = '/login';
    });

    document.getElementById('sidebarToggle').addEventListener('click', () => {
      document.getElementById('sidebar').classList.toggle('show');
    });

    // Load Results
    async function loadResults() {
      try {
        const res = await fetch('/api/student/results', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();

        const tbody = document.getElementById('resultsBody');
        const gradePoints = { A: 5, B: 4, C: 3, D: 2, E: 1, F: 0 };

        if (data.success && data.data.length > 0) {
          let totalPoints = 0;
          let totalCredits = 0;

          tbody.innerHTML = data.data.map(result => {
            const units = result.course?.creditUnits || 0;
            totalPoints += (gradePoints[result.grade] || 0) * units;
            totalCredits += units;

            const gradeClass = `grade-${result.grade.toLowerCase()}`;

            return `
              <tr>
                <td><span class="code-badge">${result.course?.code || '-'}</span></td>
                <td>${result.course?.title || '-'}</td>
                <td>${units}</td>
                <td>${result.score}</td>
                <td><span class="grade-badge ${gradeClass}">${result.grade}</span></td>
                <td>${result.session}</td>
                <td>${result.semester}</td>
              </tr>
            `;
          }).join('');

          const gpa = totalCredits > 0 ? (totalPoints / totalCredits).toFixed(2) : '0.00';
          document.getElementById('gpaDisplay').textContent = gpa;
          document.getElementById('totalCourses').textContent = data.data.length;
          document.getElementById('totalUnits').textContent = totalCredits;
        } else {
          tbody.innerHTML = `<tr><td colspan="7" class="text-center py-4 text-muted">No results available yet.</td></tr>`;
        }
      } catch (err) {
        console.error(err);
      }
    }

    loadResults();
  </script>
</body>
</html>
