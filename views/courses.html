<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Courses | Student Academic Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- SIDEBAR (same as dashboard) -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <i class="bi bi-mortarboard-fill"></i>
        <span>AcadPortal</span>
      </div>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section">Main</div>
      
      <a href="/dashboard" class="nav-item">
        <i class="bi bi-grid-1x2-fill"></i>
        <span>Dashboard</span>
      </a>

      <a href="/courses" class="nav-item active">
        <i class="bi bi-book-fill"></i>
        <span>Courses</span>
      </a>

      <a href="/results" class="nav-item">
        <i class="bi bi-clipboard-data-fill"></i>
        <span>Results</span>
      </a>

      <a href="/timetable" class="nav-item">
        <i class="bi bi-calendar-week-fill"></i>
        <span>Timetable</span>
      </a>

      <div class="nav-section">Account</div>

      <a href="/profile" class="nav-item">
        <i class="bi bi-person-fill"></i>
        <span>Profile</span>
      </a>

      <a href="#" class="nav-item" id="logoutBtn">
        <i class="bi bi-box-arrow-right"></i>
        <span>Logout</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="user-info">
        <div class="avatar" id="userAvatar">--</div>
        <div>
          <div class="user-name" id="sidebarUserName">Loading...</div>
          <div class="user-role" id="sidebarUserRole">Student</div>
        </div>
      </div>
    </div>
  </div>

  <!-- MAIN CONTENT -->
  <div class="main-content">
    <header class="top-navbar">
      <div class="d-flex align-items-center gap-3">
        <button class="btn-toggle-sidebar" id="sidebarToggle">
          <i class="bi bi-list"></i>
        </button>
        <div class="page-title">Courses</div>
      </div>
    </header>

    <div class="page-content">

      <!-- Tabs -->
      <ul class="nav nav-pills mb-4 gap-2" id="courseTabs">
        <li class="nav-item">
          <button class="nav-link active" id="tab-available" onclick="showTab('available')">
            Available Courses
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-link" id="tab-mycourses" onclick="showTab('mycourses')">
            My Registered Courses
          </button>
        </li>
      </ul>

      <!-- Available Courses -->
      <div id="availableSection">
        <div class="card-modern">
          <div class="card-header-modern">
            <h5>Available Courses</h5>
          </div>
          <div class="table-responsive">
            <table class="table table-modern">
              <thead>
                <tr>
                  <th>Code</th>
                  <th>Title</th>
                  <th>Units</th>
                  <th>Level</th>
                  <th>Semester</th>
                  <th>Lecturer</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="availableCoursesBody">
                <tr>
                  <td colspan="7" class="text-center py-4 text-muted">Loading courses...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- My Courses -->
      <div id="myCoursesSection" style="display: none;">
        <div class="card-modern">
          <div class="card-header-modern">
            <h5>My Registered Courses</h5>
          </div>
          <div class="table-responsive">
            <table class="table table-modern">
              <thead>
                <tr>
                  <th>Code</th>
                  <th>Title</th>
                  <th>Units</th>
                  <th>Semester</th>
                  <th>Lecturer</th>
                  <th>Session</th>
                </tr>
              </thead>
              <tbody id="myCoursesBody">
                <tr>
                  <td colspan="6" class="text-center py-4 text-muted">Loading...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user') || 'null');

    if (!token || !user) {
      window.location.href = '/login';
    }

    // Populate sidebar
    document.getElementById('sidebarUserName').textContent = user.fullName;
    document.getElementById('sidebarUserRole').textContent = `Student • ${user.level} Level`;
    const names = user.fullName.split(' ');
    const initials = names.length >= 2 ? names[0][0] + names[1][0] : names[0].substring(0, 2);
    document.getElementById('userAvatar').textContent = initials.toUpperCase();

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', (e) => {
      e.preventDefault();
      localStorage.clear();
      window.location.href = '/login';
    });

    // Sidebar toggle
    document.getElementById('sidebarToggle').addEventListener('click', () => {
      document.getElementById('sidebar').classList.toggle('show');
    });

    // Tab switching
    function showTab(tab) {
      document.getElementById('availableSection').style.display = tab === 'available' ? 'block' : 'none';
      document.getElementById('myCoursesSection').style.display = tab === 'mycourses' ? 'block' : 'none';
      
      document.getElementById('tab-available').classList.toggle('active', tab === 'available');
      document.getElementById('tab-mycourses').classList.toggle('active', tab === 'mycourses');

      if (tab === 'mycourses') loadMyCourses();
    }

    // Load Available Courses
    async function loadAvailableCourses() {
      try {
        const res = await fetch('/api/student/courses', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();

        const tbody = document.getElementById('availableCoursesBody');
        
        if (data.success && data.data.length > 0) {
          tbody.innerHTML = data.data.map(course => `
            <tr>
              <td><span class="code-badge">${course.code}</span></td>
              <td>${course.title}</td>
              <td>${course.creditUnits}</td>
              <td>${course.level}</td>
              <td>${course.semester}</td>
              <td>${course.lecturer}</td>
              <td>
                <button class="btn btn-sm btn-primary" onclick="registerCourse('${course._id}')">
                  Register
                </button>
              </td>
            </tr>
          `).join('');
        } else {
          tbody.innerHTML = `<tr><td colspan="7" class="text-center py-4 text-muted">No courses available.</td></tr>`;
        }
      } catch (err) {
        console.error(err);
      }
    }

    // Load My Courses
    async function loadMyCourses() {
      try {
        const res = await fetch('/api/student/my-courses', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();

        const tbody = document.getElementById('myCoursesBody');
        
        if (data.success && data.data.length > 0) {
          tbody.innerHTML = data.data.map(reg => `
            <tr>
              <td><span class="code-badge">${reg.course.code}</span></td>
              <td>${reg.course.title}</td>
              <td>${reg.course.creditUnits}</td>
              <td>${reg.semester}</td>
              <td>${reg.course.lecturer}</td>
              <td>${reg.session}</td>
            </tr>
          `).join('');
        } else {
          tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-muted">You have not registered for any course yet.</td></tr>`;
        }
      } catch (err) {
        console.error(err);
      }
    }

    // Register for a course
    async function registerCourse(courseId) {
      try {
        const res = await fetch('/api/student/register-course', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({
            courseId,
            session: '2025/2026',
            semester: 'First'
          })
        });

        const data = await res.json();

        if (data.success) {
          alert('Successfully registered for the course!');
          loadMyCourses();
        } else {
          alert(data.message);
        }
      } catch (err) {
        alert('Registration failed. Please try again.');
      }
    }

    // Initial load
    loadAvailableCourses();
  </script>

  <style>
    .nav-pills .nav-link {
      background: #f1f5f9;
      color: #475569;
      font-weight: 500;
      border-radius: 10px;
      padding: 0.6rem 1.25rem;
    }
    .nav-pills .nav-link.active {
      background: linear-gradient(135deg, #1e40af, #3b82f6);
      color: white;
    }
  </style>
</body>
</html>
