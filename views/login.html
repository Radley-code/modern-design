<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Student Academic Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(ellipse at 18% 18%, rgba(197, 154, 107, 0.16), transparent 38%),
        linear-gradient(135deg, #182a2c 0%, #233f3d 58%, #315b57 100%);
      padding: 1.5rem;
    }
    .auth-card {
      background: #fbfaf6;
      border-radius: 20px;
      box-shadow: 0 25px 50px -12px rgba(15, 31, 31, 0.34);
      width: 100%;
      max-width: 440px;
      padding: 2.5rem;
      animation: slideUp 0.5s ease;
    }
    .auth-logo {
      text-align: center;
      margin-bottom: 2rem;
    }
    .auth-logo i {
      font-size: 2.8rem;
      color: #315b57;
    }
    .auth-logo h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #263638;
      margin-top: 0.5rem;
    }
    .auth-logo p {
      color: #697978;
      font-size: 0.9rem;
    }
    .form-control {
      padding: 0.75rem 1rem;
      border-radius: 10px;
      border: 1px solid #dedfd8;
      font-size: 0.95rem;
    }
    .form-control:focus {
      border-color: #527a73;
      box-shadow: 0 0 0 3px rgba(49, 91, 87, 0.14);
    }
    .btn-auth {
      background: linear-gradient(135deg, #315b57, #527a73);
      border: none;
      padding: 0.8rem;
      border-radius: 10px;
      font-weight: 600;
      font-size: 1rem;
      transition: all 0.3s ease;
    }
    .btn-auth:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(49, 91, 87, 0.24);
    }
    .auth-footer {
      text-align: center;
      margin-top: 1.75rem;
      font-size: 0.9rem;
      color: #697978;
    }
    .auth-footer a {
      color: #315b57;
      font-weight: 600;
      text-decoration: none;
    }
    .input-group-text {
      background: #f2f1eb;
      border: 1px solid #dedfd8;
      border-radius: 10px 0 0 10px;
    }
    .password-group {
      position: relative;
    }
    .password-group .form-control {
      padding-right: 3.25rem;
    }
    .password-toggle {
      position: absolute;
      top: 50%;
      right: 0.55rem;
      z-index: 5;
      display: grid;
      place-items: center;
      width: 2.25rem;
      height: 2.25rem;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: #697978;
      transform: translateY(-50%);
      transition: background 0.2s ease, color 0.2s ease;
    }
    .password-toggle:hover {
      background: #e7eeea;
      color: #315b57;
    }
    .password-toggle:focus-visible {
      outline: 3px solid rgba(49, 91, 87, 0.3);
      outline-offset: 1px;
    }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="auth-logo">
      <i class="bi bi-mortarboard-fill"></i>
      <h1>AcadPortal</h1>
      <p>Sign in to your academic account</p>
    </div>

    <div id="alertBox"></div>

    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label fw-semibold">Email Address</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-envelope"></i></span>
          <input type="email" class="form-control" id="email" placeholder="you@example.com" required>
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label fw-semibold">Password</label>
        <div class="input-group password-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" class="form-control" id="password" placeholder="••••••••" autocomplete="current-password" required>
          <button type="button" class="password-toggle" id="passwordToggle" aria-label="Show password" aria-pressed="false" aria-controls="password">
            <i class="bi bi-eye" aria-hidden="true"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-auth w-100">
        Sign In
      </button>
    </form>

    <div class="auth-footer">
      Don’t have an account? <a href="/register">Create one</a>
    </div>
  </div>

  <script>
    const passwordField = document.getElementById('password');
    const passwordToggle = document.getElementById('passwordToggle');

    passwordToggle.addEventListener('click', () => {
      const showingPassword = passwordField.type === 'password';
      passwordField.type = showingPassword ? 'text' : 'password';
      passwordToggle.setAttribute('aria-label', showingPassword ? 'Hide password' : 'Show password');
      passwordToggle.setAttribute('aria-pressed', String(showingPassword));
      passwordToggle.innerHTML = showingPassword
        ? '<i class="bi bi-eye-slash" aria-hidden="true"></i>'
        : '<i class="bi bi-eye" aria-hidden="true"></i>';
      passwordField.focus({ preventScroll: true });
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const alertBox = document.getElementById('alertBox');

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (data.success) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));

          // Redirect based on role
          if (data.user.role === 'admin') {
            window.location.href = '/admin';
          } else {
            window.location.href = '/dashboard';
          }
        } else {
          alertBox.innerHTML = `<div class="alert alert-danger">${data.message}</div>`;
        }
      } catch (err) {
        alertBox.innerHTML = `<div class="alert alert-danger">Something went wrong. Please try again.</div>`;
      }
    });
  </script>
</body>
</html>
